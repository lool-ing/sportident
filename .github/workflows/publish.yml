# Publishes to npm on a version tag (v0.1.0, ...). No NPM_TOKEN: npm
# Trusted Publishing authenticates this workflow through OIDC, and
# --provenance links the package to this build. It stops before building
# unless the tag is v<package.json version> and CHANGELOG.md has that
# version's dated section.

name: publish
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack (pins pnpm from package.json `packageManager`)
        run: corepack enable && corepack prepare --activate
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Tag, package.json and CHANGELOG.md agree
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section '## [$version] - YYYY-MM-DD'"
            exit 1
          fi
      # A version published by hand (the first release) or a re-run tag: skip.
      - name: Skip a version that is already on npm
        id: npm
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "::notice::$spec is already on npm; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.npm.outputs.published != 'true'
        run: pnpm build
      - if: steps.npm.outputs.published != 'true'
        run: pnpm test
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public
