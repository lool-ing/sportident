# git-cliff: CHANGELOG.md in Keep a Changelog form, from Conventional Commits.
# `pnpm changelog` prepends the unreleased commits as the next version
# (see AGENTS.md, "Releasing"). Edit the result by hand where it helps users.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
# The HTML comments only order the sections; they are stripped in the body.
commit_parsers = [
  { message = "(?i)security", group = "<!-- 5 -->Security" },
  { message = "(?i)deprecat", group = "<!-- 2 -->Deprecated" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Removed" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^(docs|test|chore|ci|build|style)", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

# Next version by SemVer from the commits since the last tag: feat bumps the
# minor, fix/perf the patch. While the major is 0 a breaking change bumps the
# minor (SemVer item 4); from 1.0.0 it bumps the major.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
